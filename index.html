<!DOCTYPE html>
<html>
<head>
<title>Daily Smile</title>
<style>
body {
    margin: 0;
    text-align: center;
    font-family: Arial, sans-serif;
    background-color: #fff7f0;
}
h2 {
    margin-top: 15px;
    font-size: 42px;
}
#message {
    font-size: 72px;
    max-width: 90%;
    line-height: 1.4;
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<h2>🌟 Daily Smile 🌟</h2>
<p id="message"></p>
<script>
const messages = [
"💗 Stress has never resolved any issues!",
"🌞 You don't have to be amazing every day. Some days, just wearing pants is an achievement.",
"🎪 Not my circus, not my monkeys... but I definitely know the clown.",
"😊 We may not know exactly what tomorrow brings, but we know who we are: capable, resilient people who have overcome challenges before. One day at a time, together, we will find our way forward.",
"😁 Take a deep breath. Remember: if panic burned calories, we'd all be fitness models by now.",
"🌈 A little laughter, a little kindness, and a snack can solve more problems than most people realize.",
"😂 Today's goal: Be at least as relaxed as a capybara floating in a hot spring!",
"😄 Breaking news: You are officially allowed to take yourself 20% less seriously today.",
"😄 Your current success rate for surviving difficult days is 100%. That's a pretty impressive statistic.",
"🤣 Stress is just your brain sending you unnecessary push notifications. Feel free to ignore some of them.",
"😋 Be gentle with yourself today. You're a human being, not a Wi‑Fi signal. You don't have to be strong, connected, and available all the time. ❤️😊",
"🌻 Something good is probably on its way. In the meantime, enjoy the coffee, the sunshine, and the little wins.",
"🐾 Be as confident as a dog who brings you the same ball 47 times and still believes it's the greatest game ever invented.",
"🌻 Grow through what you go through. Or just nap through it. Both are acceptable options sometimes.",
"🦦 Channel your inner otter: float a little more, worry a little less.",
"😎 I can handle whatever today brings... after a snack.",
"🦥 Today's energy level: peaceful sloth. Not lazy. Energy-efficient.",
"😂 Today's reminder: If you can't find the light at the end of the tunnel, check if you've accidentally put your sunglasses on.",
"🐼 Be like a panda today. Eat, relax, look adorable, and let everyone else worry about the complicated stuff.",
"💪 Remember: you have survived every awkward conversation, bad haircut, and Monday so far. You're unstoppable.",
"🎈 Growing older is mandatory. Growing up remains optional.",
"🌮 Happiness is finding money in a pocket and snacks in a cupboard.",
"😄 Breaking news: You are officially allowed to take yourself 20% less seriously today."
];
const random = Math.floor(Math.random() * messages.length);
document.getElementById("message").innerHTML = messages[random];
</script>
</body>
</html>
